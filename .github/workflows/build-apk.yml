# Компилира APK при всяко качване в main и прави GitHub Release за изтегляне.
# Ръчно: GitHub → Actions → "Build APK" → Run workflow.
name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ за подписване (ако има добавени Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Подписва се с твоя ключ."
          else
            echo "Няма KEYSTORE_BASE64 – подписва се с временен ключ (виж README)."
          fi

      - name: Тестове и компилация
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            --stacktrace

      - name: Име на файла
        run: cp app/build/outputs/apk/release/app-release.apk AIModerator-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AIModerator-apk
          path: AIModerator-*.apk

      - name: Release за изтегляне
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: AI Модератор 1.0.${{ github.run_number }}
          body: |
            Изтегли `AIModerator-1.0.${{ github.run_number }}.apk` на телефона и го отвори, за да инсталираш.
            Ако Android пита – разреши „Инсталиране от неизвестни източници“ за браузъра/файловия мениджър.
          files: AIModerator-*.apk
          make_latest: true
